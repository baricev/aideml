name: Optimization Test
on:
  push:
    paths:
      - '**/*.py'
      - '.github/workflows/optimization-test.yml'
  workflow_dispatch:
env:
  SKIP_OPT_TEST: ${{ vars.SKIP_OPT_TEST || 'false' }}
jobs:
  optimization-test:
    if: ${{ vars.SKIP_OPT_TEST != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run optimization test
        run: echo "Running optimization test"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: Run optimization
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          aide agent.code.model="deepseek-chat" agent.feedback.model="deepseek-chat" report.model="deepseek-chat" generate_report=False agent.steps=1 data_dir="aide/example_tasks/house_prices" goal="Predict the sales price for each house" eval="RMSE between log-prices"
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: aide-logs
          path: logs/
